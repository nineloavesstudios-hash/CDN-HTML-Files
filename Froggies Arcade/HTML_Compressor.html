
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proton HTML Compressor/Fancifier</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:ital,wght@0,300;0,400;0,500;1,400&display=swap" rel="stylesheet">

    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #120019;
            --surface2: #1e0a2e;
            --surface3: #2a1040;
            --border: rgba(255, 255, 255, 0.08);
            --text: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.35);
            --text-dim: rgba(255, 255, 255, 0.55);
            --danger: #ff5555;
            --radius: 14px;
            --radius-sm: 8px;
        }

        html,
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #120019, #302145, #120019);
            color: var(--text);
            font-family: 'DM Mono', monospace;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.012) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.012) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 0;
        }

        body::after {
            content: '';
            position: fixed;
            top: -180px;
            left: 50%;
            transform: translateX(-50%);
            width: 700px;
            height: 400px;
            background: radial-gradient(ellipse, rgba(255, 255, 255, 0.08) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        .page-wrap {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 60px 24px 80px;
        }

        /* ── HEADER ── */
        .header {
            text-align: center;
            margin-bottom: 48px;
            animation: enterDown 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        .header-eyebrow {
            font-size: 0.65rem;
            letter-spacing: 0.3em;
            color: rgba(255, 255, 255, 0.5);
            text-transform: uppercase;
            margin-bottom: 14px;
        }

        .header h1 {
            font-family: 'Syne', sans-serif;
            font-size: clamp(2.2rem, 6vw, 3.8rem);
            font-weight: 800;
            letter-spacing: -0.03em;
            line-height: 1;
            animation: glow 2s infinite alternate;
        }

        @keyframes glow {
            0% {
                text-shadow: 0 0 15px rgba(255, 255, 255, 0.6), 0 0 25px rgba(255, 255, 255, 0.4);
            }

            100% {
                text-shadow: 0 0 30px #ffffff, 0 0 55px rgba(255, 255, 255, 0.7), 0 0 80px rgba(200, 150, 255, 0.3);
            }
        }

        .header-sub {
            margin-top: 12px;
            color: var(--text-muted);
            font-size: 0.8rem;
            letter-spacing: 0.05em;
        }

        /* ── CONTAINER ── */
        .container {
            background: rgba(18, 0, 25, 0.92);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--radius);
            max-width: 1100px;
            width: 95%;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.04), 0 40px 80px rgba(0, 0, 0, 0.7), 0 0 40px rgba(100, 50, 150, 0.2);
            animation: enterUp 0.7s 0.1s cubic-bezier(0.22, 1, 0.36, 1) both;
            overflow: hidden;
            transition: border-color 0.25s, box-shadow 0.25s;
        }

        .container.dragover {
            border-color: rgba(255, 255, 255, 0.45);
            box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08), 0 0 40px rgba(255, 255, 255, 0.08);
        }

        .section {
            padding: 24px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .section:last-child {
            border-bottom: none;
        }

        .section-title {
            font-size: 0.62rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        /* ── IO ── */
        .io-container {
            display: flex;
            gap: 16px;
        }

        .io-col {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .io-label {
            font-size: 0.6rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        textarea {
            width: 100%;
            min-height: 260px;
            padding: 14px;
            border-radius: var(--radius-sm);
            border: 1px solid rgba(255, 255, 255, 0.12);
            outline: none;
            font-family: 'DM Mono', monospace;
            font-size: 0.75rem;
            line-height: 1.7;
            background: #302145;
            color: var(--text);
            resize: vertical;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        textarea::placeholder {
            color: rgba(255, 255, 255, 0.22);
        }

        textarea:focus {
            border-color: rgba(255, 255, 255, 0.4);
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.07), inset 0 0 10px rgba(255, 255, 255, 0.03);
        }

        textarea[readonly] {
            background: #1e0a2e;
            cursor: default;
        }

        /* ── FILE UPLOAD ── */
        .file-upload {
            display: flex;
            align-items: center;
            gap: 14px;
            cursor: pointer;
            padding: 16px 20px;
            border-radius: var(--radius-sm);
            border: 1.5px dashed rgba(255, 255, 255, 0.1);
            background: transparent;
            transition: all 0.25s ease;
            position: relative;
            overflow: hidden;
        }

        .file-upload::before {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(255, 255, 255, 0.035);
            opacity: 0;
            transition: opacity 0.25s;
        }

        .file-upload:hover {
            border-color: rgba(255, 255, 255, 0.45);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.08), inset 0 0 20px rgba(255, 255, 255, 0.02);
        }

        .file-upload:hover::before {
            opacity: 1;
        }

        .upload-icon {
            width: 26px;
            height: 26px;
            color: var(--text-muted);
            flex-shrink: 0;
            position: relative;
            z-index: 1;
            transition: color 0.2s, transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .file-upload:hover .upload-icon {
            color: #fff;
            transform: translateY(-2px);
        }

        .upload-text {
            font-size: 0.78rem;
            color: var(--text-dim);
            position: relative;
            z-index: 1;
            line-height: 1.5;
        }

        .upload-text strong {
            color: var(--text);
            font-weight: 500;
        }

        .upload-subtext {
            font-size: 0.65rem;
            color: var(--text-muted);
        }

        #fileName {
            margin-left: auto;
            font-size: 0.68rem;
            color: var(--text-muted);
            position: relative;
            z-index: 1;
            max-width: 220px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            transition: all 0.2s;
        }

        #fileName.has-file {
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            padding: 4px 10px;
            color: #fff;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.08);
        }

        /* ── ADVANCED ── */
        .advanced-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            user-select: none;
            font-size: 0.68rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--text-muted);
            transition: color 0.2s;
            width: fit-content;
        }

        .advanced-toggle:hover {
            color: var(--text);
        }

        .adv-chevron {
            display: inline-block;
            font-size: 0.5rem;
            opacity: 0.5;
            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .advanced-toggle.open .adv-chevron {
            transform: rotate(180deg);
        }

        .advanced-content {
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow: hidden;
            max-height: 0;
            opacity: 0;
            transition: max-height 0.45s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.3s ease, margin-top 0.3s ease;
            margin-top: 0;
        }

        .advanced-content.visible {
            opacity: 1;
            max-height: 600px;
            margin-top: 20px;
        }

        .option-group {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: flex-start;
        }

        /* ── TOGGLE SWITCH ── */
        .toggle-field {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }

        .toggle-field-label {
            font-size: 0.72rem;
            color: var(--text-dim);
            user-select: none;
        }

        .toggle {
            position: relative;
            display: inline-block;
            width: 38px;
            height: 20px;
            flex-shrink: 0;
        }

        .toggle input {
            display: none;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            inset: 0;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 34px;
            transition: 0.3s;
        }

        .slider::before {
            position: absolute;
            content: "";
            height: 12px;
            width: 12px;
            left: 3px;
            bottom: 3px;
            background: rgba(255, 255, 255, 0.35);
            border-radius: 50%;
            transition: 0.3s;
        }

        input:checked+.slider {
            background: rgba(255, 255, 255, 0.18);
            border-color: rgba(255, 255, 255, 0.5);
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.25);
        }

        input:checked+.slider::before {
            transform: translateX(18px);
            background: #ffffff;
            box-shadow: 0 0 6px rgba(255, 255, 255, 0.9);
        }

        /* ── SELECTS / INPUTS ── */
        .field {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .field-label {
            font-size: 0.6rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        select,
        input[type=number] {
            background: #302145;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: var(--radius-sm);
            color: var(--text);
            font-family: 'DM Mono', monospace;
            font-size: 0.78rem;
            padding: 10px 12px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        select {
            appearance: none;
            -webkit-appearance: none;
            padding-right: 32px;
            background-image: url('data:image/svg+xml;utf8,<svg fill="%23888" height="16" viewBox="0 0 24 24" width="16" xmlns="http://www.w3.org/2000/svg"><path d="M7 10l5 5 5-5z"/></svg>');
            background-repeat: no-repeat;
            background-position: right 10px center;
            cursor: pointer;
            width: 150px;
        }

        select option {
            background: #1e0a2e;
        }

        select:focus,
        input[type=number]:focus {
            border-color: rgba(255, 255, 255, 0.4);
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.07);
        }

        input[type=number] {
            width: 140px;
            -moz-appearance: textfield;
        }

        input[type=number]::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button {
            -webkit-appearance: none;
        }

        /* ── ACTION BUTTONS ── */
        .action-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        .btn-primary {
            font-family: 'Syne', sans-serif;
            font-weight: 700;
            font-size: 0.9rem;
            letter-spacing: 0.05em;
            padding: 13px 30px;
            background: linear-gradient(135deg, #302145, #120019);
            color: #ffffff;
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.4);
            transition: all 0.3s ease;
        }

        .btn-primary::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to right, transparent, rgba(255, 255, 255, 0.1), transparent);
            transform: translateX(-100%);
            transition: transform 0.5s ease;
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #120019, #302145);
            box-shadow: 0 0 25px #ffffff, 0 0 40px rgba(255, 255, 255, 0.4);
            transform: translateY(-2px);
        }

        .btn-primary:hover::after {
            transform: translateX(100%);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-ghost {
            font-family: 'DM Mono', monospace;
            font-size: 0.75rem;
            padding: 11px 18px;
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-dim);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-ghost:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text);
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-1px);
        }

        .btn-ghost.copied {
            color: rgba(120, 255, 180, 0.9);
            border-color: rgba(120, 255, 180, 0.4);
            background: rgba(120, 255, 180, 0.07);
        }

        /* ── FOOTER ── */
        .footer {
            margin-top: 32px;
            font-size: 0.65rem;
            color: var(--text-muted);
            letter-spacing: 0.1em;
            animation: enterUp 0.7s 0.25s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        @keyframes enterDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes enterUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 700px) {
            .io-container {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <div class="page-wrap">

        <div class="header">
            <div class="header-eyebrow">v2.0 · HTML Toolkit</div>
            <h1>Proton HTML Compressor</h1>
            <p class="header-sub">compress or beautify your HTML easily</p>
        </div>

        <div class="container" id="container">

            <!-- IO -->
            <div class="section">
                <div class="section-title">Editor</div>
                <div class="io-container">
                    <div class="io-col">
                        <div class="io-label">Input</div>
                        <textarea id="inputHTML" placeholder="<!-- paste or drop your HTML here -->"></textarea>
                    </div>
                    <div class="io-col">
                        <div class="io-label">Output</div>
                        <textarea id="outputHTML" readonly placeholder="processed HTML will appear here…"></textarea>
                    </div>
                </div>
            </div>

            <!-- Advanced -->
            <div class="section">
                <div class="advanced-toggle" id="advancedToggle">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="4" y1="6" x2="20" y2="6" />
                        <line x1="4" y1="12" x2="20" y2="12" />
                        <line x1="4" y1="18" x2="20" y2="18" />
                    </svg>
                    Advanced Settings
                    <span class="adv-chevron">▼</span>
                </div>

                <div class="advanced-content" id="advancedContent">

                    <div class="option-group">
                        <label class="toggle-field">
                            <label class="toggle"><input type="checkbox" id="removeComments"><span class="slider"></span></label>
                            <span class="toggle-field-label">Remove Comments</span>
                        </label>
                        <label class="toggle-field">
                            <label class="toggle"><input type="checkbox" id="minifyInline"><span class="slider"></span></label>
                            <span class="toggle-field-label">Minify Inline CSS/JS</span>
                        </label>
                        <label class="toggle-field">
                            <label class="toggle"><input type="checkbox" id="prettyAttr" checked><span class="slider"></span></label>
                            <span class="toggle-field-label">Pretty Print</span>
                        </label>
                        <label class="toggle-field">
                            <label class="toggle"><input type="checkbox" id="collapseEmpty"><span class="slider"></span></label>
                            <span class="toggle-field-label">Collapse Empty Elements</span>
                        </label>
                        <label class="toggle-field">
                            <label class="toggle"><input type="checkbox" id="lowercase"><span class="slider"></span></label>
                            <span class="toggle-field-label">Lowercase Tags/Attrs</span>
                        </label>
                        <label class="toggle-field">
                            <label class="toggle"><input type="checkbox" id="sortAttrs"><span class="slider"></span></label>
                            <span class="toggle-field-label">Sort Attributes</span>
                        </label>
                        <label class="toggle-field">
                            <label class="toggle"><input type="checkbox" id="preserveLines" checked><span class="slider"></span></label>
                            <span class="toggle-field-label">Preserve Empty Lines</span>
                        </label>
                    </div>

                    <div class="option-group">
                        <div class="field">
                            <span class="field-label">Indentation</span>
                            <select id="indentSelect">
                                <option value="2">2 spaces</option>
                                <option value="4">4 spaces</option>
                                <option value="tab">Tab</option>
                            </select>
                        </div>
                        <div class="field">
                            <span class="field-label">Max Line Length</span>
                            <input type="number" id="maxLineLength" placeholder="0 = no limit" min="0">
                        </div>
                    </div>

                </div>
            </div>

            <!-- File upload -->
            <div class="section">
                <div class="section-title">Source</div>
                <div class="file-upload" id="customUpload">
                    <svg class="upload-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242" />
                        <path d="M12 12v9" />
                        <path d="m16 16-4-4-4 4" />
                    </svg>
                    <div class="upload-text">
                        <strong>Drop file here</strong> or click to browse
                        <div class="upload-subtext">.html files only</div>
                    </div>
                    <span id="fileName">no file selected</span>
                </div>
                <input type="file" id="fileInput" accept=".html" hidden>
            </div>

            <!-- Actions -->
            <div class="section">
                <div class="action-buttons">
                    <button class="btn-primary" id="processBtn">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <polygon points="5 3 19 12 5 21 5 3" />
                        </svg>
                        Process HTML
                    </button>
                    <button class="btn-ghost" id="downloadBtn">Download</button>
                    <button class="btn-ghost" id="clearInput">Clear Input</button>
                    <button class="btn-ghost" id="clearOutput">Clear Output</button>
                    <button class="btn-ghost" id="copyOutput">Copy Output</button>
                </div>
            </div>

        </div>

        <div class="footer">Proton HTML Tools &nbsp;·&nbsp; compress or beautify your HTML easily</div>

    </div>

    <script>
        const inputHTML = document.getElementById('inputHTML');
        const outputHTML = document.getElementById('outputHTML');
        const processBtn = document.getElementById('processBtn');
        const fileInput = document.getElementById('fileInput');
        const fileName = document.getElementById('fileName');
        const downloadBtn = document.getElementById('downloadBtn');
        const clearInputBtn = document.getElementById('clearInput');
        const clearOutputBtn = document.getElementById('clearOutput');
        const copyOutputBtn = document.getElementById('copyOutput');
        const advancedToggle = document.getElementById('advancedToggle');
        const advancedContent = document.getElementById('advancedContent');
        const container = document.getElementById('container');
        const customUpload = document.getElementById('customUpload');

        const removeCommentsChk = document.getElementById('removeComments');
        const minifyInlineChk = document.getElementById('minifyInline');
        const prettyAttrChk = document.getElementById('prettyAttr');
        const collapseEmptyChk = document.getElementById('collapseEmpty');
        const lowercaseChk = document.getElementById('lowercase');
        const sortAttrsChk = document.getElementById('sortAttrs');
        const indentSelect = document.getElementById('indentSelect');
        const maxLineLengthInput = document.getElementById('maxLineLength');

        let uploadedFile = null;

        advancedToggle.addEventListener('click', () => {
            advancedContent.classList.toggle('visible');
            advancedToggle.classList.toggle('open');
        });

        customUpload.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', () => {
            if (!fileInput.files.length) return;
            uploadedFile = fileInput.files[0];
            fileName.textContent = uploadedFile.name;
            fileName.classList.add('has-file');
            const reader = new FileReader();
            reader.onload = e => {
                inputHTML.value = e.target.result;
            };
            reader.readAsText(uploadedFile);
        });

        container.addEventListener('dragover', e => {
            e.preventDefault();
            container.classList.add('dragover');
        });
        container.addEventListener('dragleave', () => container.classList.remove('dragover'));
        container.addEventListener('drop', e => {
            e.preventDefault();
            container.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (!file) return;
            if (!file.name.match(/\.html?$/i)) return alert('Only .html files are supported.');
            fileInput.files = e.dataTransfer.files;
            fileInput.dispatchEvent(new Event('change'));
        });

        function processHTML(html) {
            if (removeCommentsChk.checked) html = html.replace(/<!--[\s\S]*?-->/g, '');
            if (minifyInlineChk.checked) {
                html = html.replace(/<style[\s\S]*?<\/style>/gi, m => m.replace(/\s+/g, ' ').trim());
                html = html.replace(/<script[\s\S]*?<\/script>/gi, m => m.replace(/\s+/g, ' ').trim());
            }
            if (lowercaseChk.checked) html = html.replace(/<\/?[\w-]+/g, m => m.toLowerCase());
            if (collapseEmptyChk.checked) html = html.replace(/<(\w+)([^>]*)><\/\1>/g, '<$1$2/>');

            if (prettyAttrChk.checked) {
                const indentChar = indentSelect.value === 'tab' ? '\t' : indentSelect.value === '4' ? '    ' : '  ';
                let indent = 0;
                html = html.replace(/>\s+</g, '><').split(/(?=<)/).map(tag => {
                    if (tag.match(/^<\/\w/)) {
                        indent = Math.max(0, indent - 1);
                        return '\n' + indentChar.repeat(indent) + tag;
                    } else if (tag.match(/^<\w/)) {
                        let parts = tag.match(/<(\w+)([^>]*)>/);
                        if (parts) {
                            const tagName = parts[1];
                            const attrs = parts[2].trim();
                            if (attrs) {
                                let attrArr = attrs.match(/[\w-]+="[^"]*"/g) || [];
                                if (sortAttrsChk.checked) attrArr.sort();
                                tag = '<' + tagName + '\n' + attrArr.map(a => indentChar + indentChar + a).join('\n') + '>';
                            }
                        }
                        const line = '\n' + indentChar.repeat(indent) + tag;
                        if (!tag.endsWith('/>') && !tag.startsWith('</')) indent++;
                        return line;
                    } else return '\n' + indentChar.repeat(indent) + tag;
                }).join('');
                html = html.trim();
            } else {
                html = html.replace(/\n/g, '').replace(/\s+/g, ' ').replace(/>\s+</g, '><').trim();
            }

            const maxLen = parseInt(maxLineLengthInput.value);
            if (maxLen > 0) {
                html = html.split('\n').map(line => {
                    if (line.length <= maxLen) return line;
                    const chunks = [];
                    for (let i = 0; i < line.length; i += maxLen) chunks.push(line.slice(i, i + maxLen));
                    return chunks.join('\n');
                }).join('\n');
            }

            return html;
        }

        processBtn.addEventListener('click', () => {
            const html = inputHTML.value;
            if (!html.trim()) {
                alert('Please enter or upload HTML first.');
                return;
            }
            outputHTML.value = processHTML(html);
        });

        downloadBtn.addEventListener('click', () => {
            if (!outputHTML.value) {
                alert('Nothing to download!');
                return;
            }
            const blob = new Blob([outputHTML.value], {
                type: 'text/html'
            });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = uploadedFile ? `processed_${uploadedFile.name}` : 'processed.html';
            a.click();
        });

        clearInputBtn.addEventListener('click', () => {
            inputHTML.value = '';
        });
        clearOutputBtn.addEventListener('click', () => {
            outputHTML.value = '';
        });
        copyOutputBtn.addEventListener('click', () => {
            if (!outputHTML.value) return;
            navigator.clipboard.writeText(outputHTML.value);
            copyOutputBtn.textContent = '✓ Copied';
            copyOutputBtn.classList.add('copied');
            setTimeout(() => {
                copyOutputBtn.textContent = 'Copy Output';
                copyOutputBtn.classList.remove('copied');
            }, 1800);
        });
    </script>
</body>

</html>
