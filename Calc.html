
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Proton — Animated Calculator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:ital,wght@0,300;0,400;0,500;1,400&display=swap" rel="stylesheet">

    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg1: #120019;
            --bg2: #302145;
            --surface: rgba(18, 0, 25, 0.92);
            --surface2: #1e0a2e;
            --surface3: #2a1040;
            --border: rgba(255, 255, 255, 0.08);
            --text: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.35);
            --text-dim: rgba(255, 255, 255, 0.55);
            --radius: 14px;
            --radius-sm: 8px;
        }

        html,
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, var(--bg1), var(--bg2), var(--bg1));
            color: var(--text);
            font-family: 'DM Mono', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px 60px;
        }

        /* grid texture */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.012) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.012) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 0;
        }

        /* ambient glow */
        body::after {
            content: '';
            position: fixed;
            top: -180px;
            left: 50%;
            transform: translateX(-50%);
            width: 700px;
            height: 400px;
            background: radial-gradient(ellipse, rgba(255, 255, 255, 0.08) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        /* ── SHELL ── */
        .shell {
            position: relative;
            z-index: 1;
            width: min(980px, 98vw);
            display: grid;
            grid-template-columns: 1fr 340px;
            gap: 16px;
            align-items: start;
            animation: enterUp 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        @keyframes enterUp {
            from {
                opacity: 0;
                transform: translateY(24px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes glow {
            0% {
                text-shadow: 0 0 15px rgba(255, 255, 255, 0.6), 0 0 25px rgba(255, 255, 255, 0.4);
            }

            100% {
                text-shadow: 0 0 30px #ffffff, 0 0 55px rgba(255, 255, 255, 0.7), 0 0 80px rgba(200, 150, 255, 0.3);
            }
        }

        @keyframes fadeSlideIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ── CARD ── */
        .card,
        .panel {
            background: var(--surface);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--radius);
            box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.04), 0 32px 70px rgba(0, 0, 0, 0.7), 0 0 40px rgba(100, 50, 150, 0.15);
            overflow: hidden;
        }

        .section {
            padding: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .section:last-child {
            border-bottom: none;
        }

        .section-title {
            font-size: 0.62rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        /* ── HEADER ── */
        .header {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .logo {
            width: 42px;
            height: 42px;
            border-radius: 10px;
            background: linear-gradient(135deg, #302145, #120019);
            border: 1px solid rgba(255, 255, 255, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            box-shadow: 0 0 18px rgba(255, 255, 255, 0.2);
            animation: logoPulse 3s ease-in-out infinite alternate;
        }

        @keyframes logoPulse {
            0% {
                box-shadow: 0 0 10px rgba(255, 255, 255, 0.15);
            }

            100% {
                box-shadow: 0 0 24px rgba(255, 255, 255, 0.4), 0 0 40px rgba(200, 150, 255, 0.2);
            }
        }

        .logo svg {
            width: 20px;
            height: 20px;
        }

        .title {
            font-family: 'Syne', sans-serif;
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            animation: glow 2s infinite alternate;
        }

        .subtitle {
            font-size: 0.65rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-top: 3px;
        }

        /* ── DISPLAY ── */
        .display {
            background: #1e0a2e;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: var(--radius-sm);
            padding: 16px;
            min-height: 90px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            gap: 4px;
            box-shadow: inset 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .display-meta {
            font-size: 0.6rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        .expr {
            font-size: 0.9rem;
            color: var(--text-dim);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            min-height: 1.2em;
        }

        .res {
            font-family: 'Syne', sans-serif;
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            color: #ffffff;
            animation: glow 2s infinite alternate;
            min-height: 1.2em;
            line-height: 1;
        }

        /* ── KEYPAD ── */
        .keypad {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .btn {
            font-family: 'DM Mono', monospace;
            font-size: 0.88rem;
            font-weight: 500;
            padding: 14px 8px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: var(--radius-sm);
            background: #2a1040;
            color: var(--text);
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
            opacity: 0;
            transform: translateY(12px);
            position: relative;
            overflow: hidden;
        }

        .btn::after {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(255, 255, 255, 0);
            transition: background 0.15s;
        }

        .btn:hover {
            border-color: rgba(255, 255, 255, 0.35);
            background: #302145;
            transform: translateY(-1px);
            box-shadow: 0 0 18px rgba(255, 255, 255, 0.12);
        }

        .btn:active {
            transform: translateY(0);
            filter: brightness(0.9);
        }

        .btn-op {
            background: linear-gradient(135deg, #302145, #1e0a2e);
            border-color: rgba(255, 255, 255, 0.18);
            color: #ffffff;
            font-family: 'Syne', sans-serif;
            font-weight: 700;
        }

        .btn-op:hover {
            box-shadow: 0 0 22px rgba(255, 255, 255, 0.25), 0 0 40px rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.5);
        }

        .btn-alt {
            background: #1e0a2e;
            color: var(--text-dim);
            border-color: rgba(255, 255, 255, 0.06);
        }

        .btn-alt:hover {
            color: #fff;
        }

        .btn-equals {
            background: linear-gradient(135deg, #302145, #120019);
            border-color: rgba(255, 255, 255, 0.3);
            color: #ffffff;
            font-family: 'Syne', sans-serif;
            font-weight: 800;
            font-size: 1.1rem;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
        }

        .btn-equals:hover {
            background: linear-gradient(135deg, #120019, #302145);
            box-shadow: 0 0 28px #ffffff, 0 0 50px rgba(255, 255, 255, 0.4);
            transform: translateY(-2px);
        }

        /* ── PANEL ── */
        .panel {
            min-height: 120px;
        }

        .adv-toggle {
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            user-select: none;
            font-size: 0.68rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--text-muted);
            transition: color 0.2s;
        }

        .adv-toggle:hover {
            color: var(--text);
        }

        .adv-chevron {
            font-size: 0.5rem;
            opacity: 0.5;
            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .adv-toggle.open .adv-chevron {
            transform: rotate(180deg);
        }

        .advanced-content {
            overflow: hidden;
            max-height: 0;
            opacity: 0;
            transition: max-height 0.45s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.3s ease, margin-top 0.3s ease;
            margin-top: 0;
        }

        .advanced-content.open {
            max-height: 600px;
            opacity: 1;
            margin-top: 14px;
        }

        .adv-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .adv-grid .btn {
            font-size: 0.75rem;
            padding: 11px 6px;
        }

        .footer-note {
            font-size: 0.6rem;
            letter-spacing: 0.1em;
            color: var(--text-muted);
            text-align: center;
            line-height: 1.6;
        }

        @media (max-width: 900px) {
            .shell {
                grid-template-columns: 1fr;
            }

            .panel {
                order: 2;
            }
        }

        @media (max-width: 420px) {
            .btn {
                padding: 12px 6px;
                font-size: 0.82rem;
            }

            .res {
                font-size: 1.4rem;
            }
        }
    </style>
</head>

<body>

    <div class="shell">

        <!-- Main calculator card -->
        <div class="card">

            <!-- Header -->
            <div class="section">
                <div class="header">
                    <div class="logo" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="1.5" stroke-linecap="round">
                            <path d="M3 12h18" />
                            <path d="M12 3v18" />
                        </svg>
                    </div>
                    <div>
                        <div class="title">Proton Calculator</div>
                        <div class="subtitle">Animated · Responsive</div>
                    </div>
                </div>
            </div>

            <!-- Display -->
            <div class="section">
                <div class="display" role="region" aria-label="calculator display">
                    <div class="display-meta" id="modeIndicator">Basic</div>
                    <div class="expr" id="expr">0</div>
                    <div class="res" id="res">&nbsp;</div>
                </div>
            </div>

            <!-- Keypad -->
            <div class="section">
                <div class="keypad" id="mainKeys">
                    <button class="btn btn-alt" data-fn="clear">C</button>
                    <button class="btn btn-alt" data-fn="back">⌫</button>
                    <button class="btn btn-alt" data-fn="percent">%</button>
                    <button class="btn btn-op" data-val="/">÷</button>

                    <button class="btn" data-val="7">7</button>
                    <button class="btn" data-val="8">8</button>
                    <button class="btn" data-val="9">9</button>
                    <button class="btn btn-op" data-val="*">×</button>

                    <button class="btn" data-val="4">4</button>
                    <button class="btn" data-val="5">5</button>
                    <button class="btn" data-val="6">6</button>
                    <button class="btn btn-op" data-val="-">−</button>

                    <button class="btn" data-val="1">1</button>
                    <button class="btn" data-val="2">2</button>
                    <button class="btn" data-val="3">3</button>
                    <button class="btn btn-op" data-val="+">+</button>

                    <button class="btn btn-alt" data-fn="sign">+/−</button>
                    <button class="btn" data-val="0">0</button>
                    <button class="btn" data-val=".">.</button>
                    <button class="btn btn-equals" data-fn="equals">=</button>
                </div>
            </div>

        </div>

        <!-- Side panel -->
        <div class="panel">

            <div class="section">
                <div class="adv-toggle" id="advToggle">
                    <span style="display:flex;align-items:center;gap:8px;">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="4" y1="6" x2="20" y2="6" />
                            <line x1="4" y1="12" x2="20" y2="12" />
                            <line x1="4" y1="18" x2="20" y2="18" />
                        </svg>
                        Advanced
                    </span>
                    <span class="adv-chevron">▼</span>
                </div>

                <div class="advanced-content" id="advancedArea">
                    <div class="adv-grid">
                        <button class="btn btn-alt" data-fn="square">x²</button>
                        <button class="btn btn-alt" data-fn="sqrt">√x</button>
                        <button class="btn btn-alt" data-fn="cube">x³</button>
                        <button class="btn btn-alt" data-fn="cbrt">∛x</button>
                        <button class="btn btn-alt" data-fn="pow">xʸ</button>
                        <button class="btn btn-alt" data-fn="recip">1/x</button>
                        <button class="btn btn-alt" data-fn="pi">π</button>
                        <button class="btn btn-alt" data-fn="e">e</button>
                        <button class="btn btn-alt" data-fn="sin">sin</button>
                        <button class="btn btn-alt" data-fn="cos">cos</button>
                        <button class="btn btn-alt" data-fn="tan">tan</button>
                        <button class="btn btn-alt" data-fn="asin">arcsin</button>
                        <button class="btn btn-alt" data-fn="acos">arccos</button>
                        <button class="btn btn-alt" data-fn="atan">arctan</button>
                        <button class="btn btn-alt" data-fn="log">log</button>
                        <button class="btn btn-alt" data-fn="ln">ln</button>
                        <button class="btn btn-alt" data-fn="exp">exp</button>
                    </div>
                </div>
            </div>

            <div class="section">
                <div class="footer-note">
                    Enter = eval &nbsp;·&nbsp; Backspace = del &nbsp;·&nbsp; Esc = clear
                </div>
            </div>

        </div>

    </div>

    <script>
        const exprEl = document.getElementById('expr');
        const resEl = document.getElementById('res');
        let expr = '0';

        function updateDisplay() {
            exprEl.textContent = expr;
            try {
                const val = eval(expr.replace(/×/g, '*').replace(/÷/g, '/'));
                resEl.textContent = val !== undefined && val !== null ? val : '';
            } catch {
                resEl.textContent = '';
            }
        }

        document.querySelectorAll('.btn').forEach((btn, i) => {
            btn.style.animation = 'fadeSlideIn 0.4s forwards';
            btn.style.animationDelay = `${0.03 * i}s`;

            btn.addEventListener('click', () => {
                const val = btn.dataset.val;
                const fn = btn.dataset.fn;

                if (val !== undefined) {
                    expr = expr === '0' ? val : expr + val;
                }

                if (fn !== undefined) {
                    switch (fn) {
                        case 'clear':
                            expr = '0';
                            break;
                        case 'back':
                            expr = expr.slice(0, -1) || '0';
                            break;
                        case 'equals':
                            try {
                                expr = eval(expr.replace(/×/g, '*').replace(/÷/g, '/')) + '';
                            } catch {}
                            break;
                        case 'sign':
                            expr = expr.startsWith('-') ? expr.slice(1) : '-' + expr;
                            break;
                        case 'percent':
                            expr += '/100';
                            break;
                        case 'square':
                            expr = '(' + expr + ')**2';
                            break;
                        case 'sqrt':
                            expr = 'Math.sqrt(' + expr + ')';
                            break;
                        case 'cube':
                            expr = '(' + expr + ')**3';
                            break;
                        case 'cbrt':
                            expr = 'Math.cbrt(' + expr + ')';
                            break;
                        case 'pow':
                            expr = 'Math.pow(' + expr + ',2)';
                            break;
                        case 'recip':
                            expr = '1/(' + expr + ')';
                            break;
                        case 'pi':
                            expr += 'Math.PI';
                            break;
                        case 'e':
                            expr += 'Math.E';
                            break;
                        case 'sin':
                            expr = 'Math.sin(' + expr + ')';
                            break;
                        case 'cos':
                            expr = 'Math.cos(' + expr + ')';
                            break;
                        case 'tan':
                            expr = 'Math.tan(' + expr + ')';
                            break;
                        case 'asin':
                            expr = 'Math.asin(' + expr + ')';
                            break;
                        case 'acos':
                            expr = 'Math.acos(' + expr + ')';
                            break;
                        case 'atan':
                            expr = 'Math.atan(' + expr + ')';
                            break;
                        case 'log':
                            expr = 'Math.log10(' + expr + ')';
                            break;
                        case 'ln':
                            expr = 'Math.log(' + expr + ')';
                            break;
                        case 'exp':
                            expr = 'Math.exp(' + expr + ')';
                            break;
                    }
                }
                updateDisplay();
            });
        });

        document.addEventListener('keydown', e => {
            if (e.key >= '0' && e.key <= '9') expr = expr === '0' ? e.key : expr + e.key;
            else if (['+', '-', '*', '/'].includes(e.key)) expr += e.key;
            else if (e.key === 'Enter') {
                try {
                    expr = eval(expr) + '';
                } catch {}
            } else if (e.key === 'Backspace') expr = expr.slice(0, -1) || '0';
            else if (e.key === 'Escape') expr = '0';
            updateDisplay();
        });

        const advToggle = document.getElementById('advToggle');
        const advArea = document.getElementById('advancedArea');
        advToggle.addEventListener('click', () => {
            advArea.classList.toggle('open');
            advToggle.classList.toggle('open');
            advArea.setAttribute('aria-hidden', !advArea.classList.contains('open'));
        });
    </script>
</body>

</html>
